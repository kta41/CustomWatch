plugins {
    id 'com.android.application'
}

android {
    namespace 'es.lifefit.watch'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'es.lifefit.watch'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "CustomWatch-${variant.name}.apk"
        }
    }
}

dependencies {
    testImplementation files("${gradle.gradleHomeDir}/lib/junit-4.13.2.jar", "${gradle.gradleHomeDir}/lib/hamcrest-core-1.3.jar")
}